# 붙여넣을 위치: hopes/.github/workflows/release-build.yml  (hopes 전용)
# moil / heartguard / BookOn 은 release 서명 설정(signingConfigs)이 없어 서명 방식 확정 전까지 적용하지 않는다.
# 목적: v* 태그(또는 수동 실행) 시 서명된 AAB/APK 를 만들어 Artifacts 와 draft GitHub Release 로 올린다. Play 업로드는 수동.
#
# 필요한 Secret (Settings → Environments → release 에 등록, 값은 채팅·파일에 남기지 않는다):
#   RELEASE_KEYSTORE_BASE64  : base64 -i release.jks | pbcopy 로 만든 keystore 문자열
#   RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
name: Release Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 태그/수동 실행이 동시에 두 번 돌지 않도록 한다.
concurrency:
  group: release-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # environment 에 Required reviewers 를 걸면 승인 후에만 서명 Secret 이 주입된다.
    environment: release
    permissions:
      contents: write # draft Release 생성에 필요
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      # hopes 는 서명 정보가 없으면 경고만 남기고 unsigned 로 빌드가 "성공"한다. 이를 막기 위해 먼저 검사한다.
      - name: 서명 Secret 존재 확인
        run: |
          for SECRET_NAME in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!SECRET_NAME}" ]; then
              echo "::error::${SECRET_NAME} Secret 이 비어 있습니다. unsigned 산출물을 막기 위해 중단합니다."
              exit 1
            fi
          done

      # 태그(v1.0.8)와 커밋된 versionName(1.0.8)이 다르면 잘못된 버전 배포이므로 중단한다.
      - name: 태그와 versionName 일치 확인
        if: github.ref_type == 'tag'
        run: |
          APP_VERSION_NAME=$(grep -oE 'versionName *= *"[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)"/\1/')
          if [ "v${APP_VERSION_NAME}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::태그(${GITHUB_REF_NAME})와 versionName(v${APP_VERSION_NAME})이 다릅니다."
            exit 1
          fi

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK 설치
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Gradle 캐시 설정
        uses: gradle/actions/setup-gradle@v4

      # keystore 는 워크스페이스가 아닌 RUNNER_TEMP 에 복원해 실수로 커밋되지 않게 한다.
      # build.gradle.kts 가 local.properties 의 RELEASE_* 를 읽으므로 같은 형식으로 생성한다. (RELEASE_STORE_FILE 은 절대경로)
      - name: keystore 복원 및 local.properties 생성
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          python3 - <<'PY'
          import os
          # properties 형식에서 역슬래시는 이스케이프 문자라 두 번 써야 한다.
          def escape_value(raw_value):
              return raw_value.replace("\\", "\\\\")
          lines = [
              "RELEASE_STORE_FILE=" + escape_value(os.environ["RUNNER_TEMP"] + "/release.jks"),
              "RELEASE_STORE_PASSWORD=" + escape_value(os.environ["RELEASE_STORE_PASSWORD"]),
              "RELEASE_KEY_ALIAS=" + escape_value(os.environ["RELEASE_KEY_ALIAS"]),
              "RELEASE_KEY_PASSWORD=" + escape_value(os.environ["RELEASE_KEY_PASSWORD"]),
          ]
          with open("local.properties", "w") as properties_file:
              properties_file.write("\n".join(lines) + "\n")
          PY

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 서명 AAB / APK 빌드
        run: ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace

      # 산출물이 실제로 서명되었는지 검증한다. 서명되지 않았으면 실패시킨다.
      - name: 서명 여부 검증
        run: |
          AAB_FILE=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          jarsigner -verify "$AAB_FILE" | tee "$RUNNER_TEMP/jarsigner.log"
          grep -q "jar verified" "$RUNNER_TEMP/jarsigner.log"

      # 성공·실패와 관계없이 keystore 와 서명 정보를 러너에서 제거한다.
      - name: 서명 정보 정리
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks" local.properties

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      # 태그 실행일 때만 draft Release 를 만든다. 공개 여부는 사람이 확인 후 직접 결정한다.
      - name: draft GitHub Release 생성
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            app/build/outputs/bundle/release/*.aab \
            app/build/outputs/apk/release/*.apk
